# Site
title: growdu
subtitle: 技术·学习·实践·人生·哲学
author: growdu
language: zh-CN
timezone:
description: 技术学习实践，涵盖数据库内核（PostgreSQL/openGauss）、分布式系统、高性能网络（DPDK/VPP）等工程实践，同时记录工具评测、视频创作、培训分享、股票与金融、哲学思辨、人生感悟与社会观察。
keywords: PostgreSQL,openGauss,数据库,分布式系统,Raft,DCF,DPDK,VPP,C语言,后端开发,编程,存储,高可用,股票,金融,投资,哲学,人生,社会,工具,视频,培训

# URL
url: https://growdu.cn
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
skip_render:
  - lib/**/*
  - 404.html
  - manifest.json
  - sw.js
  - favicon.svg

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  # Recommended: nofollow adds the full safe rel (noopener + external +
  # nofollow + noreferrer). Safer for reverse-tabnabbing + privacy.
  # Turn off if you want to credit specific outbound links for SEO.
  nofollow: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs

prismjs:
  preprocess: false
  line_number: false
  tab_replace: '  '

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Pagination
per_page: 10
pagination_dir: page

# Archive pagination (4xx posts - paginate for performance)
archive_generator:
  per_page: 30
  yearly: true
  monthly: false

# RSS Feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content: false

# Extensions
theme: matery

# Search
search:
  path: search.xml
  field: post
  content: false
  format: strip

# Markdown
marked:
  prependRoot: true
  postAsset: false
  lazyload: true

# Include/Exclude
include:
exclude:
ignore:

# Deployment (using GitHub Actions, not hexo-deployer-git)
deploy:
  type: ''
