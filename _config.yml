# Site
title: 编程之路
subtitle: 一位资深后端研发工程师的编程学习之路
description: 编程学习之路
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://growdu.github.io/blog
root: /blog/
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

# Home page
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Pagination
per_page: 12
pagination_dir: page

# Extensions
theme: matery

# Search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Markdown
marked:
  prependRoot: true
  postAsset: false
  lazyload: false

# Include/Exclude
include:
exclude:
ignore:

# Deployment (using GitHub Actions, not hexo-deployer-git)
deploy:
  type: ''
