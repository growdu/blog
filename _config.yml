# Site
title: 编程之路
subtitle: 一位资深后端研发工程师的编程学习之路
author: growdu
language: zh-CN
timezone: Asia/Shanghai
description: 资深后端研发工程师的技术博客，专注数据库内核（PostgreSQL/openGauss）、分布式系统（Raft/DCF）、高性能网络（DPDK/VPP）等领域的技术分享与实践笔记。
keywords: PostgreSQL,openGauss,数据库,分布式系统,Raft,DCF,DPDK,VPP,C语言,后端开发,编程,存储,高可用

# URL
url: https://growdu.github.io/blog
root: /blog/
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
skip_render:
  - lib/**/*
  - 404.html
  - manifest.json
  - sw.js

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs

prismjs:
  preprocess: false
  line_number: false
  tab_replace: '  '

# Home page
index_generator:
  path: ''
  per_page: 20
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Pagination
per_page: 20
pagination_dir: page

# Archive pagination (473 posts - paginate for performance)
archive_generator:
  per_page: 20
  yearly: true
  monthly: true

# RSS Feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content: true

# Extensions
theme: matery

# Search
search:
  path: search.xml
  field: post
  content: true
  format: strip

# Markdown
marked:
  prependRoot: true
  postAsset: false
  lazyload: true

# Include/Exclude
include:
exclude:
ignore:

# Deployment (using GitHub Actions, not hexo-deployer-git)
deploy:
  type: ''
