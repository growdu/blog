# Site
title: growdu
subtitle: 技术·学习·实践·人生·哲学
author: growdu
language: zh-CN
timezone:
description: 技术学习实践，涵盖数据库内核（PostgreSQL/openGauss）、分布式系统、高性能网络（DPDK/VPP）等工程实践，同时记录工具评测、视频创作、培训分享、股票与金融、哲学思辨、人生感悟与社会观察。
# 那句定位话。跟上面的 description 分工：
#   description —— 给搜索引擎看的那句长描述（meta description、分享卡片）；
#   home_hero_lead —— 给人看的那句短话。
# 2026-11-19：它从首页首屏搬到了顶部导航栏里，紧跟在站名「growdu」
# 后面（首页上是 h1，别的页面是 span）—— 首页正文因此只剩统计条 +
# 学习路径，正好一屏。
# 首屏那行 13px 的小标签（config.subtitle「技术·学习·实践·人生·哲学」）已经
# 去掉了：它列的就是下面 9 个徽章里的同一批东西。
home_hero_lead: 让写代码成为一种习惯
keywords: PostgreSQL,openGauss,数据库,分布式系统,Raft,DCF,DPDK,VPP,C语言,后端开发,编程,存储,高可用,股票,金融,投资,哲学,人生,社会,工具,视频,培训

# URL
url: https://growdu.cn
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
skip_render:
  - lib/**/*
  - 404.html
  - manifest.json
  - sw.js
  - favicon.svg

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  # Recommended: nofollow adds the full safe rel (noopener + external +
  # nofollow + noreferrer). Safer for reverse-tabnabbing + privacy.
  # Turn off if you want to credit specific outbound links for SEO.
  nofollow: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs

prismjs:
  preprocess: false
  line_number: false
  tab_replace: '  '

# Home page
index_generator:
  path: ''
  # 首页是**单页**设计：内容全在 home-content.ejs 里，而那个 partial 只在
  # `page.current === 1` 时渲染。per_page 为 0 时 hexo-pagination 只产出
  # 首页一页；留着 10 会生成 /page/2/ … /page/57/ 共 57 个零内容页
  # （既没有封面也没有列表，站内还没有入口链到它们）。
  per_page: 0
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
category_generator:
  per_page: 0
tag_generator:
  per_page: 0

tag_map:

# Pagination
per_page: 10
pagination_dir: page

# Archive pagination (4xx posts - paginate for performance)
archive_generator:
  per_page: 30
  yearly: true
  # The archive timeline links every month (see themes/matery/layout/
  # archive.ejs), so the monthly pages have to exist -- otherwise
  # /archives/2022/11/ 404s from every archive page.
  monthly: true

# RSS Feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content: false

# Extensions
theme: matery

# Search
search:
  path: search.json
  field: post
  content: true
  format: strip

# Markdown
marked:
  prependRoot: true
  postAsset: false
  lazyload: true

# Include/Exclude
include:
exclude:
ignore:

# Deployment (using GitHub Actions, not hexo-deployer-git)
deploy:
  type: ''
