baseURL = "https://growdu.github.io/blog/"
defaultContentLanguage = "zh-cn"
title = "编程之路"
theme = "blowfish"
contentDir = "docs"
enableGitInfo = true
enableRobotsTXT = true
paginate = 12
pluralizeListTitles = false

[languages.zh-cn]
languageCode = "zh-CN"
languageName = "中文"
weight = 1

[frontmatter]
date = [":git", "lastmod", "date", "publishDate"]
lastmod = [":git", "lastmod", "date", "publishDate"]
publishDate = [":git", "lastmod", "date", "publishDate"]

[params]
colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true
mainSections = ["ai", "alg", "base", "chatgpt", "cluster", "code", "computer_communication", "database", "db", "docker", "dpdk", "edit", "environment", "es", "faq", "go_web", "language", "linux", "mail", "network", "opc", "openguass", "page", "pcap", "pgsql", "programmer_self_cultivation", "protocol", "road", "src", "storage", "tools", "video_work", "vpp", "vue", "web", "wiki"]

[params.homepage]
layout = "hero"
showRecent = true
showRecentItems = 12
cardView = true
cardViewScreenWidth = false

[params.header]
layout = "hybrid"

[params.article]
showBreadcrumbs = true
showDate = true
showReadingTime = true
showWordCount = true
showTableOfContents = true
showPagination = true

[params.list]
showBreadcrumbs = true
showTableOfContents = true
groupByYear = true
cardView = true
showSummary = true

[params.taxonomy]
showTermCount = true
cardView = true

[params.footer]
showCopyright = true
showThemeAttribution = true

[[params.social]]
name = "github"
url = "https://github.com/growdu/blog"

[markup]
[markup.highlight]
style = "dracula"
lineNos = false
codeFences = true
guessSyntax = true
noClasses = true
[markup.goldmark.renderer]
unsafe = true

[security]
allowContent = ['^text/']

[taxonomies]
category = "categories"
tag = "tags"

[[menu.main]]
name = "分类"
pageRef = "categories"
weight = 10

[[menu.main]]
name = "标签"
pageRef = "tags"
weight = 20
