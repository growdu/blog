name: AIV pipeline

# 这条流水线不许只在 macOS 上绿。
#
# macOS 自带 PingFang SC，Linux 上没有——过去「换台机器跑一遍」根本跑不起来，
# 于是跨平台这件事一直只是嘴上说说。这个工作流在 ubuntu 上真跑一遍：
# 装开源中文字体、装依赖、跑全部测试。
#
# 光跑测试还不够：测试里**真的会合成出一段成片**（用入库的真实旁白与 BGM，
# 见 tests/test_compose_end_to_end.py），并按规格核对——所以这条流水线
# 证明的不只是「零件能用」，而是「整条能走通」。
#
# 已知差异：逐像素基准是按 PingFang SC 抓的，Linux 上字体不同，
# 那条守卫会**跳过并说明原因**（不是红，也不是假装绿）。

on:
  push:
    paths:
      - "aiv/**"
      - ".github/workflows/aiv-pipeline.yml"
  pull_request:
    paths:
      - "aiv/**"
  workflow_dispatch:

concurrency:
  group: aiv-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux 上跑测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-noto-cjk make \
            python3-cairo python3-numpy python3-pil python3-scipy python3-pytest
          fc-cache -f
          # `fonts-noto-cjk` 是**兜底**——内置子集装不上时的退路。
          # 主力是仓库里那份 `AIV Sans CJK SC`（下一步装）：
          # 跨机版式一致靠的是「两台机器用同一个字体文件」，
          # 系统字体只是「没装内置字体时也能出片」的保险。

      - name: 确认 Python 依赖可用
        run: |
          # 系统包装的版本与发行版一起走，最稳；只有在装不上时才退回 pip。
          # 不无条件跑 pip：它会把 apt 的 numpy 升到 2.x，和 apt 的 scipy 打架。
          python3 -c "import cairo, numpy, PIL, scipy, pytest" || \
            python3 -m pip install --break-system-packages -r aiv/pipeline/requirements.txt
          # fontTools 只用来读内置字体的 cmap（缺字守卫要用）。纯 Python，
          # 不碰 numpy/scipy，不会和 apt 的版本打架。
          python3 -c "import fontTools" || \
            python3 -m pip install --break-system-packages "fonttools>=4.0"

      - name: 装上内置字体
        working-directory: aiv/pipeline
        run: |
          # 仓库内置的字体子集：两台机器用同一份文件，跨机的版式
          # （步进宽度、收字号结果）才一致。装进 OS 的字体目录——
          # cairo 在 Linux 上走 fontconfig，只放在仓库目录里它认不得。
          python3 scripts/install_font.py
          python3 scripts/install_font.py --check

      - name: 确认字体解析到了开源中文字体
        working-directory: aiv/pipeline
        run: python3 -m pyv.cli doctor

      - name: 跑测试
        working-directory: aiv/pipeline
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q -rf 2>&1 | tee /tmp/pytest.log || true
          # 失败条目用 ::error:: 报成注解：**不登录也能从 API 看到是哪条挂了**。
          # 工作流日志要仓库管理员权限才能下，注解不要——CI 挂了却看不到原因，
          # 等于白跑。
          #
          # `|| true` 必须在**大括号里**：管道优先级高于 `||`，写成
          # `grep ... || true | while` 会被解析成 `grep || (true | while)`；
          # 而且没有匹配时 grep 退出码是 1，在 `set -e` 下会把整个步骤打断——
          # 上一版就是这么把「测试全过」变成「步骤失败」的。
          { grep -E "^(FAILED|ERROR) " /tmp/pytest.log || true; } \
            | while IFS= read -r line; do
                echo "::error title=pytest 失败::${line}"
              done
          # **失败详情也要进注解**：只报「FAILED xxx」等于没报——断言的
          # 细节（「哪一期哪一段差多少」）在日志深处，而工作流日志要管理员
          # 权限才能下，注解不要。合成一条多行注解（%0A 是换行）。
          #
          # awk 里 '%0A' 要当**字符串**拼出来：写成 printf 的格式串会被
          # 当成转换说明（%0A 不是合法的转换符）。
          detail=$(awk '/= FAILURES =/{f=1} f && /short test summary info/{exit} f' \
            /tmp/pytest.log | head -40 \
            | awk '{gsub(/%/,"%25"); printf "%s", $0; printf "%s", "%0A"}' \
            | sed 's/%0A$//')
          if [ -n "${detail}" ]; then
            echo "::error title=pytest 详情::${detail}"
          fi
          if grep -qE "^(FAILED|ERROR) " /tmp/pytest.log; then exit 1; fi
