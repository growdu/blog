name: Deploy Hexo

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  # 不取消正在跑的 run。
  #
  # GitHub 的并发语义是：同组里**最多一个 running + 一个 pending**，
  # 新 run 进来时把**旧的 pending 取消**、自己变 pending。
  # 所以 `cancel-in-progress: false` 本身就已经是「最新推送优先」——
  # 排队的永远只有最新那一个，跑完就轮到它，站点不会越积越旧。
  #
  # 真正能把队列堵死的是「某个 job 挂死不退出」：run 不结束 → 并发组不释放
  # → 后面所有推送全卡在 pending。2026-11-13 12:02 之后主站冻住就是这个：
  # deploy-server 的 ssh 卡在等密码提示，run 永远不结束。
  # 对策不是取消 run，是给每个 job 加 timeout-minutes（见下），
  # 挂死的 job 到点被杀 → run 结束 → 并发组释放 → 队列继续。
  #
  # 反过来 `cancel-in-progress: true` 在**推送很密**时更糟：
  # 新推送两分钟就砍掉上一个还没跑完 build 的 run，站点永远停在旧版本。
  # 2026-11-13 12:26 的镜像站、12:02 的主站都是这么冻住的。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 每个 job 都必须有上限。run 不结束 → 并发组不释放 → 后面所有推送卡在 pending。
    # npm install + hexo generate 实测几分钟，20 分钟够用。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inject Gitalk secrets
        env:
          # growdu.cn 域名使用 GITALK_CN_* 凭据
          GITALK_CN_CLIENT_ID: ${{ secrets.GITALK_CN_CLIENT_ID }}
          GITALK_CN_CLIENT_SECRET: ${{ secrets.GITALK_CN_CLIENT_SECRET }}
          # growdu.github.io/blog 使用 GITALK_PAGES_* 凭据
          GITALK_PAGES_CLIENT_ID: ${{ secrets.GITALK_PAGES_CLIENT_ID }}
          GITALK_PAGES_CLIENT_SECRET: ${{ secrets.GITALK_PAGES_CLIENT_SECRET }}
        run: |
          python3 - <<'PYINJECT'
          import os, sys
          keys = [
              ("__GITALK_CN_CLIENT_ID__",        "GITALK_CN_CLIENT_ID"),
              ("__GITALK_CN_CLIENT_SECRET__",    "GITALK_CN_CLIENT_SECRET"),
              ("__GITALK_PAGES_CLIENT_ID__",     "GITALK_PAGES_CLIENT_ID"),
              ("__GITALK_PAGES_CLIENT_SECRET__", "GITALK_PAGES_CLIENT_SECRET"),
          ]
          path = "_config.matery.yml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          missing = False
          for placeholder, env in keys:
              value = os.environ.get(env, "")
              if not value:
                  missing = True
              content = content.replace(placeholder, value)
              print(env, "injected" if value else "MISSING")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          sys.exit(1 if missing else 0)
          PYINJECT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Hexo dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Apply theme patches
        run: python3 tools/patch-theme.py
      - name: Copy vendor assets
        run: python3 tools/copy-vendor.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Verify rendered HTML body tags
        # Catches regressions like the 2026-08-10 broken <body> tag
        # caused by injecting partials inside the body tag itself.
        run: |
          python3 - <<'PYCHECK'
          import re, sys
          bad = []
          targets = ['public/index.html']
          for p in targets:
              try:
                  with open(p, encoding='utf-8') as f:
                      html = f.read()
              except FileNotFoundError:
                  print(f'{p}: not found, skipping')
                  continue
              m = re.search(r'<body[^>]{0,500}>', html, re.DOTALL)
              if not m:
                  print(f'!! {p}: no <body> tag found')
                  bad.append(p)
                  continue
              tag = m.group(0)
              if '<div' in tag or '<script' in tag:
                  print(f'!! BROKEN <body> in {p}: {len(tag)} chars, contains <div/<script')
                  bad.append(p)
              else:
                  print(f'OK {p}: <body> tag clean ({len(tag)} chars)')
          if bad:
              print('HTML body-tag check failed; aborting deploy')
              sys.exit(1)
          PYCHECK
      - name: Inject SW build version
        # Stamps a fresh cache name into public/sw.js so existing
        # browsers will install the new SW and evict old caches on
        # activate (fixes stale-cache regressions on big releases).
        run: |
          # Combine git short SHA + UTC timestamp + $RANDOM so even back-to-back
          # deploys (same second) get distinct cache names, and we can correlate
          # the cache version back to a commit when debugging in the field.
          # source/sw.js is listed under skip_render in _config.yml, so hexo
          # generate does NOT copy it into public/. Force-copy here so the
          # __SW_CACHE_NAME__ placeholder is actually present.
          cp source/sw.js public/sw.js
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_ID="${SHORT_SHA}-$(date -u +%Y%m%d%H%M%S)-${RANDOM}"
          sed -i "s|__SW_CACHE_NAME__|blog-v${BUILD_ID}|" public/sw.js
          grep -o "const CACHE='[^']*'" public/sw.js
          # Fail loudly if the placeholder was not replaced (e.g. CI
          # skipped the sed step). Otherwise the SW would use a literal
          # "__SW_CACHE_NAME__" cache name and evict its own cache on
          # every load.
          if grep -q '__SW_CACHE_NAME__' public/sw.js; then
            echo 'ERROR: SW cache name placeholder not replaced' >&2
            exit 1
          fi
      - name: Publish Vercount verification file
        run: |
          mkdir -p public/.well-known
          cp source/.well-known/vercount-verify-zd5pj09shdfkbm6h83ra5zzk.txt public/.well-known/ 2>/dev/null || true
      - name: Fix XML escaping in sitemap and feed
        run: |
          python3 -c "
          import re
          for fpath in ['public/sitemap.xml', 'public/atom.xml']:
              try:
                  with open(fpath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  content = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\\d+;|#x[0-9a-fA-F]+;)', '&amp;', content)
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'Fixed XML escaping in {fpath}')
              except FileNotFoundError:
                  print(f'{fpath} not found, skipping')
          "
      - name: Initialize Gitalk issues
        run: node tools/init-gitalk-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # growdu.cn is the primary domain; the growdu.github.io/blog
          # target uses build-github-pages below with its own override.
          GITALK_SITE_URL: https://growdu.cn
          GITALK_SITE_ROOT: /
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: blog-public
          path: ./public
          retention-days: 3

  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    # rsync 走 SSH 到自建服务器。**SSH 挂住时 ssh 会等密码提示**，
    # 于是这个 job 能一直挂着——2026-11-13 12:02 之后主站就冻在这儿：
    # run 不结束 → 并发组不释放 → 后面所有推送的部署全卡在 pending。
    #
    # 三道保险，每道各针对一种挂法：
    #   BatchMode       认证失败立刻报错，不再等密码提示（最常见的一种挂法）
    #   ConnectTimeout  网络不通也只等 20 秒
    #   timeout-minutes 上面都失效时（比如 rsync 传输中途断流）到点收摊
    #
    # 超时要给足余量：一次正常部署要把 167MB / 2400 个文件搬三遍
    # （artifact 上传、artifact 下载、rsync 到服务器），实测端到端
    # 十几分钟。超时是给「挂死」兜底的，不是给「慢」设限——
    # 设太紧就变成部署自己把部署杀掉。
    timeout-minutes: 30
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: blog-public
          path: ./public
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # -T 10：keyscan 自己也要有超时，遇到丢包的地址不能一直等下去。
          ssh-keyscan -T 10 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          # known_hosts 是空的，后面 ssh 会卡在「是否信任这个主机」的问句上
          # （非交互环境读不到输入，表现就是整个 job 挂住）。这里直接判死，
          # 并把最可能的原因写清楚，省得下次只能对着日志猜。
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: known_hosts 是空的——DEPLOY_HOST/DEPLOY_PORT 不对，或主机不可达" >&2
            exit 1
          fi
      - name: Deploy via rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          REL_DIR=/var/www/blog/releases
          SSH_OPTS="-p ${DEPLOY_PORT} -o BatchMode=yes -o ConnectTimeout=20"
          # 上一个 release 目录：没变的文件**直接硬链接**过去，不过网络。
          #
          # 每次部署都往新的时间戳目录里全量传 167MB / 2400 个文件，
          # 于是站点滞后多久完全取决于跨太平洋链路的快慢：
          # 2026-11-13 实测同一条命令跑出过 38 秒、也跑出过 20 分钟还没完。
          # 硬链接之后只有变化的那几个文件过网络，链路再慢也无所谓，
          # 顺带省掉服务器上重复的一份磁盘。
          PREV=$(ssh ${SSH_OPTS} "${REMOTE}" \
            "ls -1dt ${REL_DIR}/*/ 2>/dev/null | head -1" || true)
          LINK_OPT=""
          if [ -n "${PREV}" ]; then
            LINK_OPT="--link-dest=${PREV}"
            echo "link-dest: ${PREV}（没变的文件走硬链接）"
          else
            echo "没有可链接的上一个 release，本次全量传输"
          fi
          # 1. rsync 到新的 release 目录
          rsync -avz --delete ${LINK_OPT} \
            -e "ssh ${SSH_OPTS}" \
            ./public/ \
            "${REMOTE}:${REL_DIR}/${TIMESTAMP}/"
          # 2. 原子切换 symlink
          ssh ${SSH_OPTS} "${REMOTE}" "
            ln -sfn ${REL_DIR}/${TIMESTAMP} /var/www/blog/current.new && \
            mv -Tf /var/www/blog/current.new /var/www/blog/current
          "
          # 3. 清理 7 天前的旧 release（保留最近 10 个）
          #    硬链接的文件不受影响：删掉一个链接，另一个链接还在。
          ssh ${SSH_OPTS} "${REMOTE}" "
            cd ${REL_DIR} && \
            ls -1t | tail -n +11 | xargs -r rm -rf
          "
          echo "Deployed: ${TIMESTAMP}"
          echo "Live at: https://growdu.cn/"

  build-github-pages:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    # 同上：run 不结束 → 并发组不释放 → 后面所有推送都卡住。
    timeout-minutes: 20
    # Serialize after the growdu.cn build.  Both jobs used to create the
    # Gitalk issues concurrently: each listed the existing issues, each
    # saw the post as missing, and each created its own copy -> 182
    # duplicate issue pairs.  With `needs` the second job runs after the
    # first one finished creating them and simply skips them.
    # `always()` keeps the fallback: if the server build fails, the
    # Pages build (and its issue pass) still runs.
    needs: build
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Hexo dependencies
        run: npm install
      - name: Configure GitHub Pages build
        env:
          PAGES_CLIENT_ID: ${{ secrets.GITALK_PAGES_CLIENT_ID }}
          PAGES_CLIENT_SECRET: ${{ secrets.GITALK_PAGES_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          site = Path('_config.yml')
          content = site.read_text(encoding='utf-8')
          content = re.sub(r'^url:.*$', 'url: https://growdu.github.io/blog', content, count=1, flags=re.M)
          content = re.sub(r'^root:.*$', 'root: /blog/', content, count=1, flags=re.M)
          site.write_text(content, encoding='utf-8')

          client_id = os.environ.get('PAGES_CLIENT_ID', '')
          client_secret = os.environ.get('PAGES_CLIENT_SECRET', '')
          if not client_id or not client_secret:
              raise SystemExit('GitHub Pages Gitalk credentials are missing')

          theme = Path('_config.matery.yml')
          content = theme.read_text(encoding='utf-8')
          # GitHub Pages build: keep the dedicated gitalk_pages block, leave gitalk untouched
          print('Configured url/root for growdu.github.io/blog; gitalk_pages will be used at runtime')
          PY
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Apply theme patches
        run: python3 tools/patch-theme.py
      - name: Copy vendor assets
        run: python3 tools/copy-vendor.py
      - name: Build GitHub Pages site
        run: npx hexo generate
      - name: Verify rendered HTML body tags
        run: |
          python3 - <<'PYCHECK'
          import re, sys
          bad = []
          targets = ['public/index.html']
          for p in targets:
              try:
                  with open(p, encoding='utf-8') as f:
                      html = f.read()
              except FileNotFoundError:
                  print(f'{p}: not found, skipping')
                  continue
              m = re.search(r'<body[^>]{0,500}>', html, re.DOTALL)
              if not m:
                  print(f'!! {p}: no <body> tag found')
                  bad.append(p)
                  continue
              tag = m.group(0)
              if '<div' in tag or '<script' in tag:
                  print(f'!! BROKEN <body> in {p}: {len(tag)} chars, contains <div/<script')
                  bad.append(p)
              else:
                  print(f'OK {p}: <body> tag clean ({len(tag)} chars)')
          if bad:
              print('HTML body-tag check failed; aborting deploy')
              sys.exit(1)
          PYCHECK
      - name: Inject SW build version
        run: |
          # Combine git short SHA + UTC timestamp + $RANDOM so even back-to-back
          # deploys (same second) get distinct cache names, and we can correlate
          # the cache version back to a commit when debugging in the field.
          # source/sw.js is listed under skip_render in _config.yml, so hexo
          # generate does NOT copy it into public/. Force-copy here so the
          # __SW_CACHE_NAME__ placeholder is actually present.
          cp source/sw.js public/sw.js
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_ID="${SHORT_SHA}-$(date -u +%Y%m%d%H%M%S)-${RANDOM}"
          sed -i "s|__SW_CACHE_NAME__|blog-v${BUILD_ID}|" public/sw.js
          grep -o "const CACHE='[^']*'" public/sw.js
          # Fail loudly if the placeholder was not replaced (e.g. CI
          # skipped the sed step). Otherwise the SW would use a literal
          # "__SW_CACHE_NAME__" cache name and evict its own cache on
          # every load.
          if grep -q '__SW_CACHE_NAME__' public/sw.js; then
            echo 'ERROR: SW cache name placeholder not replaced' >&2
            exit 1
          fi
      - name: Initialize Gitalk issues (GitHub Pages target)
        if: ${{ always() }}
        run: node tools/init-gitalk-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITALK_SITE_URL: https://growdu.github.io
          GITALK_SITE_ROOT: /blog/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build-github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
