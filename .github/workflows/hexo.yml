name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hexo dependencies
        run: npm install
      - name: Install matery theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          python3 tools/patch-theme.py
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Debug - gitalk injection
        run: |
          echo "=== gitalk block in post-detail.ejs ==="
          grep -n -A3 'gitalk' themes/matery/layout/_partial/post-detail.ejs 2>/dev/null
          echo "=== generated post HTML structure ==="
          sample=$(find public -path '*/2025/*' -name 'index.html' | head -1)
          echo "Sample: $sample"
          grep -n 'id="artDetail"\|class="card"\|gitalk-container\|gitalk-card\|prev-next\|评论系统' "$sample" 2>/dev/null | head -20
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
