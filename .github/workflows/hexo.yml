name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hexo dependencies
        run: npm install
      - name: Install matery theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          python3 tools/patch-theme.py
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Debug - recommend widget and config
        run: |
          echo "=== top posts in source ==="
          grep -rl '^top: true' source/_posts/ 2>/dev/null | head -5
          echo "=== indexCard in generated HTML ==="
          grep -c 'indexCard\|recommend-sections' public/index.html 2>/dev/null
      - name: Debug - gitalk comments
        run: |
          echo "=== post.ejs (full) ==="
          cat themes/matery/layout/post.ejs 2>/dev/null
          echo "=== post-detail.ejs (first 30 lines) ==="
          head -30 themes/matery/layout/_partial/post-detail.ejs 2>/dev/null
          echo "=== gitalk-comments.ejs (first 10 lines) ==="
          head -10 themes/matery/layout/_partial/gitalk-comments.ejs 2>/dev/null
          echo "=== gitalk-comments before prev-next? ==="
          postejs=$(cat themes/matery/layout/post.ejs 2>/dev/null)
          gkline=$(echo "$postejs" | grep -n 'gitalk-comments' | head -1 | cut -d: -f1)
          pnline=$(echo "$postejs" | grep -n 'prev-next' | head -1 | cut -d: -f1)
          echo "gitalk-comments at line: $gkline, prev-next at line: $pnline"
          if [ -n "$gkline" ] && [ -n "$pnline" ] && [ "$gkline" -lt "$pnline" ]; then
            echo "OK: gitalk-comments is BEFORE prev-next"
          else
            echo "WARNING: gitalk-comments is NOT before prev-next"
          fi
          echo "=== gitalk in generated post HTML ==="
          sample=$(find public -path '*/2025/*' -name 'index.html' | head -1)
          echo "Sample: $sample"
          grep -o 'class="content"\|class="container"\|gitalk-container\|class="card"' "$sample" 2>/dev/null | sort | uniq -c
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
