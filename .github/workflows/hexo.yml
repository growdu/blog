name: Deploy Hexo

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Inject Gitalk secrets
        env:
          # growdu.cn 域名使用 GITALK_CN_* 凭据
          GITALK_CN_CLIENT_ID: ${{ secrets.GITALK_CN_CLIENT_ID }}
          GITALK_CN_CLIENT_SECRET: ${{ secrets.GITALK_CN_CLIENT_SECRET }}
          # growdu.github.io/blog 使用 GITALK_PAGES_* 凭据
          GITALK_PAGES_CLIENT_ID: ${{ secrets.GITALK_PAGES_CLIENT_ID }}
          GITALK_PAGES_CLIENT_SECRET: ${{ secrets.GITALK_PAGES_CLIENT_SECRET }}
        run: |
          python3 - <<'PYINJECT'
          import os, sys
          keys = [
              ("__GITALK_CN_CLIENT_ID__",        "GITALK_CN_CLIENT_ID"),
              ("__GITALK_CN_CLIENT_SECRET__",    "GITALK_CN_CLIENT_SECRET"),
              ("__GITALK_PAGES_CLIENT_ID__",     "GITALK_PAGES_CLIENT_ID"),
              ("__GITALK_PAGES_CLIENT_SECRET__", "GITALK_PAGES_CLIENT_SECRET"),
          ]
          path = "_config.matery.yml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          missing = False
          for placeholder, env in keys:
              value = os.environ.get(env, "")
              if not value:
                  missing = True
              content = content.replace(placeholder, value)
              print(env, "injected" if value else "MISSING")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          sys.exit(1 if missing else 0)
          PYINJECT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hexo dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Apply theme patches
        run: python3 tools/patch-theme.py
      - name: Copy vendor assets
        run: python3 tools/copy-vendor.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Publish Vercount verification file
        run: |
          mkdir -p public/.well-known
          cp source/.well-known/vercount-verify-zd5pj09shdfkbm6h83ra5zzk.txt public/.well-known/ 2>/dev/null || true
      - name: Fix XML escaping in sitemap and feed
        run: |
          python3 -c "
          import re
          for fpath in ['public/sitemap.xml', 'public/atom.xml']:
              try:
                  with open(fpath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  content = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\\d+;|#x[0-9a-fA-F]+;)', '&amp;', content)
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'Fixed XML escaping in {fpath}')
              except FileNotFoundError:
                  print(f'{fpath} not found, skipping')
          "
      - name: Initialize Gitalk issues
        run: node tools/init-gitalk-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-public
          path: ./public
          retention-days: 3

  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: blog-public
          path: ./public
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy via rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          # 1. rsync 到新的 release 目录
          rsync -avz --delete \
            -e "ssh -p ${DEPLOY_PORT}" \
            ./public/ \
            "${REMOTE}:/var/www/blog/releases/${TIMESTAMP}/"
          # 2. 原子切换 symlink
          ssh -p ${DEPLOY_PORT} "${REMOTE}" "
            ln -sfn /var/www/blog/releases/${TIMESTAMP} /var/www/blog/current.new && \
            mv -Tf /var/www/blog/current.new /var/www/blog/current
          "
          # 3. 清理 7 天前的旧 release（保留最近 10 个）
          ssh -p ${DEPLOY_PORT} "${REMOTE}" "
            cd /var/www/blog/releases && \
            ls -1t | tail -n +11 | xargs -r rm -rf
          "
          echo "Deployed: ${TIMESTAMP}"
          echo "Live at: https://growdu.cn/"

  build-github-pages:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hexo dependencies
        run: npm install
      - name: Configure GitHub Pages build
        env:
          PAGES_CLIENT_ID: ${{ secrets.GITALK_PAGES_CLIENT_ID }}
          PAGES_CLIENT_SECRET: ${{ secrets.GITALK_PAGES_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          site = Path('_config.yml')
          content = site.read_text(encoding='utf-8')
          content = re.sub(r'^url:.*$', 'url: https://growdu.github.io/blog', content, count=1, flags=re.M)
          content = re.sub(r'^root:.*$', 'root: /blog/', content, count=1, flags=re.M)
          site.write_text(content, encoding='utf-8')

          client_id = os.environ.get('PAGES_CLIENT_ID', '')
          client_secret = os.environ.get('PAGES_CLIENT_SECRET', '')
          if not client_id or not client_secret:
              raise SystemExit('GitHub Pages Gitalk credentials are missing')

          theme = Path('_config.matery.yml')
          content = theme.read_text(encoding='utf-8')
          # GitHub Pages build: keep the dedicated gitalk_pages block, leave gitalk untouched
          print('Configured url/root for growdu.github.io/blog; gitalk_pages will be used at runtime')
          PY
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Apply theme patches
        run: python3 tools/patch-theme.py
      - name: Copy vendor assets
        run: python3 tools/copy-vendor.py
      - name: Build GitHub Pages site
        run: npx hexo generate
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build-github-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
