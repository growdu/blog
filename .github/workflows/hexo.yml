name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hexo dependencies
        run: npm install
      - name: Install matery theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          python3 tools/patch-theme.py
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Debug - post layout structure
        run: |
          echo "========== post.ejs (FULL) =========="
          cat themes/matery/layout/post.ejs 2>/dev/null
          echo ""
          echo "========== _partial/post-detail.ejs (FULL) =========="
          cat themes/matery/layout/_partial/post-detail.ejs 2>/dev/null
          echo ""
          echo "========== _partial/gitalk-card.ejs (first 5 lines) =========="
          head -5 themes/matery/layout/_partial/gitalk-card.ejs 2>/dev/null
          echo ""
          echo "========== _partial/prev-next.ejs (first 10 lines) =========="
          head -10 themes/matery/layout/_partial/prev-next.ejs 2>/dev/null
      - name: Debug - generated post HTML
        run: |
          sample=$(find public -path '*/2025/*' -name 'index.html' | head -1)
          echo "Sample post: $sample"
          echo "========== gitalk-container context (20 lines) =========="
          grep -n -A20 'gitalk-container\|gitalk-card\|评论系统' "$sample" 2>/dev/null | head -40
          echo ""
          echo "========== container/card/main structure =========="
          grep -n 'class="content"\|class="container"\|class="card"\|class="card-content"\|prev-next\|gitalk' "$sample" 2>/dev/null | head -30
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
