name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Inject Gitalk secret
        env:
          GITALK_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}
        run: |
          python3 -c "
          import os
          with open('_config.matery.yml','r') as f: c=f.read()
          c=c.replace('__GITALK_CLIENT_SECRET__',os.environ.get('GITALK_SECRET',''))
          with open('_config.matery.yml','w') as f: f.write(c)
          print('Gitalk secret injected' if os.environ.get('GITALK_SECRET') else 'WARNING: GITALK_CLIENT_SECRET not set')
          "
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hexo dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Install matery theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          python3 tools/patch-theme.py
          python3 tools/localize-cdn.py
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Copy vendor assets
        run: python3 tools/copy-vendor.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Publish Vercount verification file
        run: |
          mkdir -p public/.well-known
          cp source/.well-known/vercount-verify-zd5pj09shdfkbm6h83ra5zzk.txt public/.well-known/
      - name: Fix XML escaping in sitemap and feed
        run: |
          python3 -c "
          import re
          for fpath in ['public/sitemap.xml', 'public/atom.xml']:
              try:
                  with open(fpath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  content = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\\d+;|#x[0-9a-fA-F]+;)', '&amp;', content)
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'Fixed XML escaping in {fpath}')
              except FileNotFoundError:
                  print(f'{fpath} not found, skipping')
          "
      - name: Initialize Gitalk issues
        run: node tools/init-gitalk-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug - customizations
        run: |
          echo "=== CDN manifest ==="
          cat tools/cdn-manifest.json 2>/dev/null || echo "NOT FOUND"
          echo "=== Localized lib files ==="
          find source/lib -type f 2>/dev/null | sort | head -30
          echo "=== Theme libs section ==="
          grep -A 30 '^libs:' themes/matery/_config.yml 2>/dev/null || echo "NOT FOUND"
          echo "=== jsDelivr setting ==="
          grep -A 2 '^jsDelivr:' themes/matery/_config.yml 2>/dev/null || echo "NOT FOUND"
          echo "=== custom-blog-style in layout files? ==="
          grep -rl 'custom-blog-style' themes/matery/layout/ 2>/dev/null || echo "NOT FOUND"
          echo "=== post-detail-toc.ejs (first 15 lines) ==="
          head -15 themes/matery/layout/_partial/post-detail-toc.ejs 2>/dev/null || echo "NOT FOUND"
          echo "=== post-wordcount.ejs (first 20 lines) ==="
          head -20 themes/matery/layout/_partial/post-wordcount.ejs 2>/dev/null || echo "NOT FOUND"
          echo "=== post-wordcount wired into post-detail.ejs? ==="
          grep -n "post-wordcount')" themes/matery/layout/_partial/post-detail.ejs 2>/dev/null || echo "NOT WIRED"
          echo "=== vercount page-pv in generated posts? ==="
          FIRST_POST=$(find public -name 'index.html' -path '*/202[0-9]/*' 2>/dev/null | head -1)
          if [ -n "$FIRST_POST" ]; then
            echo "Checking: $FIRST_POST"
            grep -oE 'vercount_value_page_pv|wordcount-info|wordcount\(page|min2read\(page' "$FIRST_POST" 2>/dev/null | sort | uniq -c
          else
            echo "NO POSTS FOUND"
          fi
          echo "=== TOC elements in generated posts ==="
          FIRST_POST=$(find public -name "index.html" -path "*/202[0-9]/*" 2>/dev/null | head -1)
          echo "Checking: $FIRST_POST"
          grep -oE 'id="toc[^"]*"|class="[^"]*toc[^"]*"' "$FIRST_POST" 2>/dev/null | sort | uniq -c || echo "NO TOC ELEMENTS"
          echo "=== hero-stats in cover files? ==="
          grep -rl 'hero-stats' themes/matery/layout/ 2>/dev/null || echo "NOT FOUND"
          echo "=== custom-blog-script in layout files? ==="
          grep -rl 'custom-blog-script' themes/matery/layout/ 2>/dev/null || echo "NOT FOUND"
          echo "=== homepage stats ==="
          grep -o 'stat-card\|category-card\|reading-progress\|分类导航' public/index.html 2>/dev/null | sort | uniq -c
          echo "=== github hrefs ==="
          grep -o 'href="[^"]*github[^"]*"' public/index.html 2>/dev/null | head -5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
