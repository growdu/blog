name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hexo dependencies
        run: npm install
      - name: Install matery theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          python3 tools/patch-theme.py
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Debug - verify pages, links, and theme templates
        run: |
          echo "=== Key pages ==="
          for p in index.html archives/index.html categories/index.html tags/index.html; do
            if [ -f "public/$p" ]; then echo "OK   public/$p ($(wc -c < public/$p) bytes)"; else echo "MISS public/$p"; fi
          done
          echo "=== Nav <a> tags with menu text ==="
          grep -oE '<a [^>]*href="[^"]*"[^>]*>[^<]*(首页|归档|分类|标签)' public/index.html 2>/dev/null | head -20
          echo "=== Internal links missing /blog/ prefix ==="
          grep -oE 'href="/[^"]*"' public/index.html 2>/dev/null | grep -v '/blog/' | sort -u | head -20
          echo "=== Theme files referencing theme.menu ==="
          grep -rln 'theme.menu' themes/matery/layout/ 2>/dev/null
          echo "=== Menu rendering code ==="
          grep -rn 'theme.menu' themes/matery/layout/ 2>/dev/null | head -20
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
