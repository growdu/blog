name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hexo dependencies
        run: npm install
      - name: Install matery theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          python3 tools/patch-theme.py
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Debug - recommend widget and config
        run: |
          echo "=== _widget directory ==="
          ls themes/matery/layout/_widget/ 2>/dev/null
          echo "=== recommend widget ==="
          cat themes/matery/layout/_widget/recommend.ejs 2>/dev/null
          echo "=== top posts in source ==="
          grep -rl '^top: true' source/_posts/ 2>/dev/null | head -5
          echo "=== indexCard in generated HTML ==="
          grep -c 'indexCard\|recommend-sections' public/index.html 2>/dev/null
      - name: Debug - gitalk comments
        run: |
          echo "=== post.ejs exists? ==="
          test -f themes/matery/layout/post.ejs && echo "YES" || echo "NO"
          echo "=== gitalk references in layout ==="
          grep -rn 'gitalk' themes/matery/layout/ 2>/dev/null | head -20
          echo "=== gitalk-comments.ejs created? ==="
          test -f themes/matery/layout/_partial/gitalk-comments.ejs && echo "YES" || echo "NO"
          echo "=== gitalk in generated post HTML ==="
          sample=$(find public -path '*/2025/*' -name 'index.html' | head -1)
          echo "Sample: $sample"
          grep -c 'gitalk\|评论系统' "$sample" 2>/dev/null || echo "0"
          echo "=== files with gitalk-container or placeholder ==="
          grep -rl 'gitalk-container\|评论系统待配置' public/ 2>/dev/null | head -10
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
