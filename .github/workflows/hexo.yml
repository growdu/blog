name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hexo dependencies
        run: npm install
      - name: Install matery theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          python3 tools/patch-theme.py
      - name: Sync content to Hexo
        run: python3 tools/sync-hexo.py
      - name: Build with Hexo
        run: npx hexo generate
      - name: Initialize Gitalk issues
        run: node tools/init-gitalk-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug - github & social links
        run: |
          echo "=== theme _config.yml github section ==="
          grep -A5 -i 'github' themes/matery/_config.yml 2>/dev/null | head -20
          echo "=== github-link.ejs ==="
          cat themes/matery/layout/_partial/github-link.ejs 2>/dev/null
          echo "=== bg-cover-content.ejs (first 40 lines) ==="
          head -40 themes/matery/layout/_partial/bg-cover-content.ejs 2>/dev/null
          echo "=== all github hrefs in homepage ==="
          grep -o 'href="[^"]*github[^"]*"' public/index.html 2>/dev/null | head -10
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
