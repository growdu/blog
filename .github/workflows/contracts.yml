name: Contracts

# 契约闸门：内容契约 + 契约层与各平台 adapter 的测试。
#
# 为什么单独一个工作流，而不是塞进 hexo.yml：
# hexo.yml 是**构建与部署**（push 到 master 就发版），这里是**守约束**
# （内容契约违规 = 构建失败）。两者的触发时机、失败后果、跑的时长都不同，
# 混在一起会让「部署失败」和「约束被破」变成同一件事。
#
# 覆盖范围：
#   - 内容契约（publish/spec/00 §4）：母稿的 front matter 必须满足字段表
#   - 契约层（publish/publishkit）：内容契约、能力模型、发布清单、调度
#   - 头条号 / 公众号 adapter：切片、出包、草稿箱的规则
#
# 视频线（aiv）不在这里：它需要 cairo / ffmpeg / 字体这套系统依赖，
# 容器里装起来比重，且它的失败模式是「渲染不出片」而不是「契约被破」。

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # sync-hexo.py 用 git log 取最早提交时间当文章日期，
          # 浅克隆会让日期算错。
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/publish.txt -r requirements/toutiao.txt -r requirements/weixin.txt

      - name: Build content units
        # 内容单元是 sync 的产物，也是契约层与 adapter 真正读的东西。
        # 没有它，adapter 的测试没有语料。
        run: python3 tools/sync-hexo.py

      - name: Content contract gate
        # 违规即失败：标题超长、platforms 不是列表、difficulty 越界……
        # 这些以前只有跑发布层才响，现在在流水线上就响。
        run: python3 tools/check-content-contract.py

      - name: Contract layer tests
        run: python3 -m pytest publish/tests -q

      - name: Toutiao adapter tests
        run: python3 -m pytest toutiao/tests -q

      - name: Weixin adapter tests
        run: python3 -m pytest weixin/tests -q
