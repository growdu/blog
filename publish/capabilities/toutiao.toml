# 头条号平台能力声明。
#
# 这是契约层与头条号 adapter 之间唯一的接缝之一（另一个是发布清单 JSON）。
# 限额是数据不是代码 —— 平台规则变了改这里，不改 Python。
#
# 数值来源：《运营手册》§2.2「头条号图文 3K」、第三方对接说明转述的平台限额。
# ⚠️ 待实测：见 toutiao/docs/02-试点记录.md 阶段一步骤 3，实测后回填。

id = "toutiao"
name = "头条号"
kind = "document"

# manual | api_draft | api_publish
# 当前是 manual：账号未认证，开放平台 API 权限开不了。
# 实测通过后改这一行即可，adapter 不需要改代码。
automation = "manual"

review = "platform"
requires_certification = true
requires_min_followers = 1000

[limits]
title_chars = 30
body_chars = 3000
digest_chars = 120
image_bytes = 5242880          # 5MB
image_formats = ["webp"]
cover_ratio = "3:4"
cover_min_pixels = [600, 800]
max_body_images = 3

[adapter]
package = "toutiao"
command = ["python3", "-m", "toutiao.cli"]
