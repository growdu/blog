# 头条号平台能力声明。
#
# 这是契约层与头条号 adapter 之间唯一的接缝之一（另一个是发布清单 JSON）。
# 限额是数据不是代码 —— 平台规则变了改这里，不改 Python。
#
# 数值来源：**2026-11-13 在头条号后台实测**（Phase 0，浏览器驱动真实编辑器，
# 用 `toutiao/out/db-logical_decode-postgresql逻辑复制-DML/` 真包走完整流程）。
# 逐项记录见 `toutiao/docs/02-试点记录.md` §R2。
#
# 每条限额后面的注释写的是「实测到什么」和「还没测到什么」——后者不能省，
# 「实测了 A」不等于「B 也实测了」。

id = "toutiao"
name = "头条号"
kind = "document"

# manual | api_draft | api_publish
# 当前是 manual：账号未认证，开放平台 API 权限开不了（见 02-试点记录.md §R1）。
# 2026-11-13 实测：**人工上传这条路走通了**（标题/正文/2 张图/封面都按清单走了一遍，
# 文章成功发表）；但**自动存草稿不行**——存草稿分支（save=0）稳定返回 err_no 7050，
# 最小草稿也复现，与内容无关。见 02-试点记录.md §R2.F。
automation = "manual"

review = "platform"
requires_certification = true
requires_min_followers = 1000

# 实测日期。下面 limits 里的每个值都在那一天的实测里对过平台。
verified = "2026-11-13"

[limits]
# 标题上限 30 字。输入框**不拦**：实测敲到 40 字都进得去，计数器显示
# 「40 / 30」并变红。
# 注意 30 这个值的依据是**占位符原文**（「2～30个字」），不是「保存被拒」：
# 那次保存弹的「保存失败」是账号侧的 err_no 7050（见 §R2.F），最小草稿也报同一个码，
# 标题超限这条被掩盖了，没能单独验成。
title_chars = 30

# 正文：这是**编辑预算**（运营手册 §2.2「头条号图文 3K」），不是平台上限。
# 实测平台侧**没有总量上限**：20000 字整段粘进去，计数器照实显示 20000，不截断。
# 平台侧真正有的是**单段**上限：单段超过 200 平台字会报「1 处段落字数过多」。
body_chars = 3000

# 单段上限（**平台字数**，不是字符数）。实测：单段 200 平台字不告警，
# 201 平台字开始报「1 处段落字数过多」。
# 「平台字数」是编辑器那套口径：非 ASCII 字符逐字 + ASCII 字符每两个折一个
# （详见 toutiao/toutiao/wordcount.py）。一段 216 个原始字符的中英混排段落
# 平台计 178 字，不告警——按字符数判就会误报。
paragraph_words = 200

# 摘要：实测**编辑器里根本没有摘要输入框**，请求参数
# search_creation_info.abstract 传的是空串 —— 摘要由平台自己生成。
# 这个值约束的是**我们产出摘要**的长度（写进包里的 title.txt 第二行），不是平台的。
digest_chars = 120

# 图片大小：实测上传面板原文「支持jpg、jpeg、png等多种格式，单张图片最大支持20MB」。
image_bytes = 20971520

# 图片格式：实测 **webp 可直接上传**（虽然面板只列了 jpg/jpeg/png）。
# 上传接口 spice/image 返回 code=0，回读的字节流开头就是 RIFF….WEBP ——
# 平台原样存、原样吐，不转码。
image_formats = ["webp"]

# 封面比例：实测封面框 152×118（≈1.29:1）；平台把正文首图自动裁成 1620×1261
# （1.285:1），与「不可小于 452*352」给出的 452:352 吻合。
# 所以封面是**横图**——早先按 3:4 竖图切，会把宽图裁成一条窄竖片。
cover_ratio = "452:352"

# 封面最小尺寸：实测上传面板原文「封面图尺寸建议大于 672*462，不可小于 452*352」。
# 这里记下限（下限才是会拦人的那条）；建议值 672*462 见上面的注释。
cover_min_pixels = [452, 352]

# 正文图张数：**未实测上限**（这次只放了 2 张）。3 张来自运营手册 §2.2。
max_body_images = 3

[adapter]
package = "toutiao"
command = ["python3", "-m", "toutiao.cli"]
