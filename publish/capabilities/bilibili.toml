# B站平台能力声明。
#
# 数值来源：B站开放平台《视频稿件提交》《封面上传》《文件上传预处理》三篇接口文档。
#
# 关于「小于 N」的换算：平台写「标题长度小于 80」就是最多 79 个字，
# 所以上限取 79 而不是 80——差一个字符就会在真实投稿时被拒。
#
# 分区 tid 已实测（2026-11-13，规格 §6.4）：
# 投稿页现在是「人选分区」灰测体系，下拉里是 31 个扁平项（id 1001–1031，
# 「科技数码」= 1012），规格里写的二级分区「计算机技术」（tid=231）不可选。
# 选「科技数码」投稿后，B站把稿件落到「科技 → 软件应用」，
# 稿件接口回读的实际 tid 是 230（父分区 188 科技）。
id = "bilibili"
name = "哔哩哔哩"
kind = "video"
# 开放平台应用：client_id（Access Key）+ app_secret，access_token 由 OAuth2 用户授权取得。
auth = "appid_secret"
# manual = 出包 + 人工上传；ARC_BASE 权限开通后改成 api_publish（规格 §6.5.3）。
automation = "manual"
review = "platform"
requires_certification = false
requires_min_followers = 0
# verified = 这些数值最后对着平台文档复核过的日期（ISO 日期）。
verified = "2026-11-13"

[limits]
title_chars = 79
description_chars = 249
tags_chars = 199
tag_chars = 20

[media]
max_width = 4096
max_height = 4096
max_fps = 120
require_pix_fmt = "yuv420p"
# 视频号部分安卓机不解 H.265，成片一律 H.264。
require_video_codec = "h264"
# 《文件上传预处理》：「时长小于 5 小时」→ 上限取 17999 s。
max_duration_s = 17999
max_bytes = 4294967296
max_audio_bitrate = 320000
max_audio_channels = 2
max_sample_rate = 48000
# 《文件上传预处理》：「视频关键帧至少 10 秒一个」→ 间隔 ≤ 10 秒。
max_keyframe_gap_s = 10
# 《文件上传预处理》：「视频码率峰值不超过 60Mbps」。
# ffprobe 只能给平均码率，给不出峰值——预检用平均码率代理判定（偏松，但实测成片
# 平均码率约 1.05 Mbps，差近两个数量级，代理够用）。口径写在规格 §5.2。
max_video_bitrate = 60000000

[adapter]
package = "bilibili"
command = ["python3", "-m", "bilibili.cli"]
