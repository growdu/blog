# 抖音平台能力声明。
#
# 数值来源：**2026-11-14 对着抖音开放平台官方文档核对**。
#
# ⚠️ 这里不是「实测」——本账号是**个人主体**，开放平台的内容发布能力批不下来
# （见下面的「主体资质」），官方接口一次都没调通过。所以下面每个数字都标了它
# 是**平台文档写明的**还是**我们自己的编辑口径**，两者混在一起就成了「拿编辑
# 偏好冒充平台规则」，那是这套能力模型最忌讳的事。
#
# 官方文档（SPA 站点，正文抓不到，参数以检索到的官方片段为准）：
# - 上传视频 https://developer.open-douyin.com/docs/resource/zh-CN/dop/develop/openapi/video-management/douyin/create-video/upload-video
# - 创建视频 https://developer.open-douyin.com/docs/resource/zh-CN/dop/develop/openapi/video-management/douyin/create-video/video-create/
# - 能力说明 https://developer.open-douyin.com/docs/resource/zh-CN/dop/ability/content-management/video.create.bind
#
# ## 主体资质：开放平台 API 这条路当前不可用
#
# 视频发布能力的 scope 是 `video.create.bind`，申请路径是
# 「控制台 → 应用详情 → 能力管理 → **能力实验室** → 代替用户发布内容到抖音」。
# 官方页面的「适用范围」写的是：
#
#   「开发者主体需为**党政机关或事业单位**」「应用类型为抖音开放平台正式**网站应用**」
#   「仅支持党政机关或事业单位，做内部的多媒体管理平台，但不可对外面向 C 端用户使用」
#
# 个人主体基本批不下来；而且这条能力明确限定「网站应用」，不是我们这种本地流水线。
# **所以 adapter 走浏览器自动化**（creator.douyin.com 后台上传），与视频号同一套路。
# 资质的事记在规格 §6.6 与 §十四第 15 条。

id = "douyin"
name = "抖音"
kind = "video"

# 浏览器自动化：个人主体拿不到开放平台的 OAuth2 凭据（见上面的「主体资质」）。
auth = "none"

# manual = 出包 + 浏览器上传 + 人工确认发布。
# 这条**不是**「平台没有接口」——接口有，是主体批不下来。哪天换成企业主体并
# 通过能力审核，就该切 api_publish（规格 §6.6）。
automation = "manual"

# 抖音有成片审核：发布后进审核队列，期间只有自己可见（官方「创建视频」接口说明）。
review = "platform"

# 抖音发视频本身不需要「创作者认证」，个人号直接发。
# 要认证的是**开放平台应用的主体**，不是账号——那是另一件事（见上面的注释）。
requires_certification = false

# 抖音没有「发稿粉丝数门槛」这条规则，记 0。
requires_min_followers = 0

# verified = 这些数值最后对着平台文档复核过的日期（ISO 日期）。
verified = "2026-11-14"

[limits]
# 抖音**没有独立的 description 字段**：标题、正文、话题、@ 全部塞在一个 `text`
# 里（话题靠 `#话题` 内嵌，@ 靠 `@昵称`）。adapter 把下面三段拼成一个 text 去发。
#
# text 的平台硬上限是 **1000 字** —— 官方错误码 2100005
# 「标题文字不得多于1000个哦~」。这是**平台写明**的。
text_chars = 1000

# 首屏展示预算：**不是 API 限制**，是编辑口径。
# 抖音信息流只露前几十个字，钩子写不进首屏等于没写。55 是常见口径，**未实测**
# （我们还没投过一条，没有反例也没有正例）。
title_chars = 55

# 正文：编辑预算。平台不单管正文长度，只管拼完的 text 总量（text_chars）。
# 未实测首屏到底露几个字，这条只是我们自己的天花板。
description_chars = 500

# 话题个数与单话题字数：**平台接口没有文档化的上限**。
# 未实测（没投过），按我们自己的口径卡：话题多了信息流里会被折叠。
topics_max = 5
topic_chars = 15

[media]
# 视频编码与像素格式：官方只写「推荐使用 mp4、webm」，没写死编码。
# 这两条取**我们出片的规格**（H.264 + yuv420p）作为闸——不是平台口径，
# 是「我们只出这一种片子」的自我约束。抖音对 H.265 的兼容性未实测。
require_video_codec = "h264"
require_pix_fmt = "yuv420p"

# 时长 ≤ 15 分钟：官方错误码 2114006「视频时长不能超过15分钟」。
max_duration_s = 900

# 视频总大小 ≤ 4GB：官方上传文档「视频总大小 4GB 以内」。
# 另注：超过 50MB 建议分片、超过 300MB 必须分片。我们的成片约 5MB，
# 永远走单请求上传——分片那条路这批片子用不上（规格 §6.6）。
max_bytes = 4294967296

# 音频门槛：平台**未文档化**。取我们出片的规格作为闸（偏严，不是平台口径）。
max_audio_channels = 2
max_sample_rate = 48000

# 尺寸与帧率：**平台未文档化任何上限**，所以这里不设闸。
# 抖音推荐竖版（官方上传接口的响应示例给的就是 720×1280），但那是推荐不是限制，
# 横版能发。竖版是我们自己的选题决定（规格 §6.6），不是平台的门槛。

[adapter]
package = "douyin"
command = ["python3", "-m", "douyin.cli"]
