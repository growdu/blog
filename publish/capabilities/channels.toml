# 微信视频号平台能力声明。
#
# 这是契约层与视频号 adapter 之间的接缝：限额与自动化档位都是**数据**，
# 平台规则变了改这里，不改 Python。
#
# 数值来源：
# - 标题 ≤ 22 字：公开口径有 20 / 22 / 34 三种说法（规格 §十四 待验证项 1），
#   本期取仓库既有的保守值 22，以视频号助手实测提示为准。
# - 简介 ≤ 1000 字、话题 ≤ 5 个：视频号发布页规则。
# - 媒体规格：视频号后台与《内容技术规范》。
#
# ⚠️ 待实测：封面比例的真实行为（规格 §十四 待验证项 2）。
id = "channels"
name = "微信视频号"
kind = "video"
# 视频号没有面向普通创作者的公开发布接口，不需要任何凭据。
auth = "none"
# manual = 出包 + 人工点发布；这条改不动，除非平台开放了正式接口。
automation = "manual"
review = "platform"
requires_certification = false
# 发稿的粉丝数门槛：视频号个人号没有这个限制，记 0。
requires_min_followers = 0
# verified = 这些数值最后对着平台文档复核过的日期（ISO 日期）。
verified = "2026-11-12"

[limits]
title_chars = 22
description_chars = 1000
topics_max = 5
topic_chars = 15

[media]
min_width = 1280
min_height = 720
max_fps = 60
require_pix_fmt = "yuv420p"
# 视频号部分安卓机不解 H.265，成片一律 H.264。
require_video_codec = "h264"
max_duration_s = 3600
max_bytes = 2147483648
# 音频门槛两平台都适用（规格 §5.2）——视频号这道闸不能缺席。
max_audio_channels = 2
max_sample_rate = 48000
# 视频号要求 moov 前置：moov 不在前面的片子，手机端要等整片下完才起播。
require_faststart = true

[adapter]
package = "channels"
command = ["python3", "-m", "channels.cli"]
