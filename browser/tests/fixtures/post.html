<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>假投稿页</title></head>
<body>
  <!--
    本地假投稿页，只用于测试浏览器执行层。

    它模仿视频号助手投稿页的**结构**（一个视频文件框、一个描述框、
    一个封面框、一个原创声明勾选框、一个发表按钮），不模仿它的样式与文案。
    测试用的是 fixtures/channels-selectors.json 里的选择器，
    与真站的选择器各走各的——真站的选择器改了，这张假页面不用改。

    「发表成功」与链接默认隐藏，点发表才显示——这样「取链接」这一步
    测的是「先等成功、再读链接」的顺序，而不是碰巧读到。
  -->
  <input id="video-file" type="file" accept="video/*">
  <input id="title" type="text" placeholder="填写标题">
  <textarea id="desc" placeholder="填写描述"></textarea>
  <input id="cover-file" type="file" accept="image/*">
  <label><input id="original" type="checkbox">原创声明</label>
  <button id="publish" type="button">发表</button>
  <div id="done" style="display:none">发表成功</div>
  <div id="link" style="display:none">https://channels.weixin.qq.com/platform/post/fixture-1</div>
  <script>
    document.getElementById('publish').addEventListener('click', function () {
      document.getElementById('done').style.display = '';
      document.getElementById('link').style.display = '';
    });
  </script>
</body>
</html>
