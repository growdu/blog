# matery theme configuration overrides

# Navigation menu (Chinese labels)
menu:
  首页: /
  归档: /archives/
  分类: /categories/
  标签: /tags/

# Local search
search:
  enable: true
  path: search.xml
  field: post

# Code copy button
code:
  copy:
    enable: true

# Image lightbox
fancybox:
  enable: true

# Image lazy loading
lazyload:
  enable: true
