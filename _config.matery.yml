      achievements:
        - 基于 Raft + epoll + Protobuf 设计分布式元信息存储系统
        - 实现 RTO≈0、RPO=0 的金融级切换能力，支持三地五中心扩展
        - 在金融、政务等核心场景完成多次生产级演练与上线
