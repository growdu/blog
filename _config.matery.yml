# matery theme configuration overrides

# Navigation menu - matery expects objects with url + icon, not plain strings
menu:
  首页:
    url: /
    icon: fa-solid fa-house
  归档:
    url: /archives/
    icon: fa-solid fa-archive
  分类:
    url: /categories/
    icon: fa-solid fa-bookmark
  标签:
    url: /tags/
    icon: fa-solid fa-tags

# Local search
search:
  enable: true
  path: search.xml
  field: post

# Code copy button
code:
  copy:
    enable: true

# Image lightbox
fancybox:
  enable: true

# Image lazy loading
lazyload:
  enable: true

# Disable the "dream" manifesto section on the homepage
dream:
  enable: false

# Featured posts section (theme's built-in recommend widget)
recommend:
  enable: true

# Disable other homepage widgets
music:
  enable: false
video:
  enable: false

# Giscus comments (https://giscus.app)
# Setup: 1) Enable Discussions on growdu/blog repo
#        2) Install giscus app: https://github.com/apps/giscus
#        3) Get repo_id & category_id from https://giscus.app
giscus:
  enable: true
  repo: growdu/blog
  repo_id: ""
  category: Announcements
  category_id: ""
