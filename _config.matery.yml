      iconBackground: 'linear-gradient(to bottom right, #3367D6 0%, #0084FF 100%)'
      url: 'https://github.com/growdu/blog'
      time: '2024.06 - 至今'
      company: 海量数据
      role: 数据库内核开发专家 / 主架构师
      desc: 在海量数据主导 PostgreSQL 逻辑复制 DDL 同步架构的设计与实现，目标是让逻辑复制在 DDL 场景下也能做到端到端一致。
      achievements:
        - 设计并实现跨 PG / SQL Server 双模式的逻辑复制 DDL 同步通道
        - 主导 DDL replay 框架落地，把任意 DDL 翻译为逻辑解码可消费的子操作序列
        - 配合 logical_decode 子模块完成 13 篇源码修炼系列文章的实战沉淀
