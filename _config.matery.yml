# matery theme configuration overrides

# Serve theme assets locally (no CDN) for faster China access
jsDelivr:
  url:

# Custom site logo (replaces the default fox).  The image is copied
# from <repo-root>/1.jpg into themes/matery/source/medias/logo.jpg by
# tools/patch-theme.py on every build, so this single path is enough.
logo: /medias/logo.jpg


# Hero typing animation strings — comprehensive site covering code, finance, philosophy, life.
subtitle:
  enable: true
  sub1: '不过些许风霜罢了'
  sub2: '技术、学习、实践'
  sub3: '人生、哲学、金融与社会'
  sub4: 'From kernels to markets, from tools to life'
  startDelay: 300
  typeSpeed: 80
  backSpeed: 30
  loop: true
  showCursor: true

# Hero sub-description displayed below the typing animation.
subDesc:
  enable: true
  text: '数据库内核 · 分布式系统 · 用户态协议 · 高性能网络 · 工具 / 视频 / 培训 · 股票 · 哲学 · 人生 · 社会'

# Three-stage life motto (replaces the default "从来没有真正的绝境..." on the homepage).
motto:
  enable: true
  texts:
    - '山是山，水是水'
    - '山不是山，水不是水'
    - '山还是山，水还是水'


# Navigation menu - matery expects objects with url + icon, not plain strings
menu:
  首页:
    url: /
    icon: fa-solid fa-house
  归档:
    url: /archives/
    icon: fa-solid fa-archive
  项目:
    url: /projects/
    icon: fa-solid fa-rocket
  分类:
    url: /categories/
    icon: fa-solid fa-bookmark
  数据库:
    url: /database/
    icon: fa-solid fa-database
  标签:
    url: /tags/
    icon: fa-solid fa-tags
  关于:
    url: /about/
    icon: fa-solid fa-user

# Local search
search:
  enable: true
  path: search.xml
  field: post

# Code copy button
code:
  copy:
    enable: true

# Image lightbox
fancybox:
  enable: true

# Image lazy loading
lazyload:
  enable: true

# Disable the "dream" manifesto section on the homepage
dream:
  enable: false

# Featured posts section (theme's built-in recommend widget)
recommend:
  enable: true

# Disable other homepage widgets
music:
  enable: false
video:
  enable: false

# Gitalk comments (https://github.com/gitalk/gitalk)
# Uses GitHub Issues - no extra services needed
# Setup: 1) Go to GitHub Settings > Developer settings > OAuth Apps > New OAuth App
#        2) Homepage URL: https://growdu.cn/
#        3) Callback URL: https://growdu.cn/
#        4) Copy Client ID and generate Client Secret
# Gitalk client IDs / secrets are injected at build time by .github/workflows/hexo.yml
# __GITALK_CN_CLIENT_ID__       => https://growdu.cn
# __GITALK_CN_CLIENT_SECRET__   => https://growdu.cn
# __GITALK_PAGES_CLIENT_ID__    => https://growdu.github.io/blog
# __GITALK_PAGES_CLIENT_SECRET__=> https://growdu.github.io/blog
gitalk:
  enable: true
  clientID: "__GITALK_CN_CLIENT_ID__"
  clientSecret: "__GITALK_CN_CLIENT_SECRET__"
  repo: blog
  owner: growdu

gitalk_pages:
  enable: true
  clientID: "__GITALK_PAGES_CLIENT_ID__"
  clientSecret: "__GITALK_PAGES_CLIENT_SECRET__"
  repo: blog
  owner: growdu

# Social links (displayed on homepage cover and footer)
# Format: key: url  (icon is auto-derived from key name by the theme)
socialLink:
  github: https://github.com/growdu
  email: mailto:growdu@gmail.com
  qq: http://wpa.qq.com/msgrd?v=3&uin=2689304284&site=qq&menu=yes

# GitHub link on homepage cover (next to "开始阅读" button)
github:
  enable: true
  url: https://github.com/growdu

# Hexo word count plugin (provides 站点总字数 in the footer)
wordcount:
  enable: true
  post_wordcount: true

# Site-level + per-page PV/UV via GoatCounter (https://www.goatcounter.com).
# Register a free account, point it at https://growdu.cn/, and
# paste your personal code (the slug in your *.goatcounter.com URL) below.
# Leave empty to disable.
goatcounter:
  code: 'growdu'
# Toggles the counter block in patch-theme.py section 6 / 7.
siteCounter:
  enable: true

# Backwards-compatible flag kept so the theme's default footer.ejs does not
# try to load the busuanzi.pure.mini.js script (we inject our own counter).
busuanziStatistics:
  enable: false
  # Render the PV / UV spans inside <div class="copy-right"> right after
  # the copyright line.  The actual busuanzi.pure.mini.js loader is
  # injected by patch-theme.py section 6 — keep `enable: false` above so
  # we don't double-load the script.
  totalTraffic: true
  totalNumberOfvisitors: true

postInfo:
  readCount: true
  wordCount: true
  min2read: true
  totalCount: true   # 站点总字数（在 footer.ejs copy-right 容器内显示）

# Table of contents on post pages (floating button + slide-out panel)
toc:
  enable: true

# Reward / 打赏
# WeChat and Alipay QR codes live at repo root (weixin.jpg, zhifubao.jpg)
# and are published into themes/matery/source/medias/reward/ by
# patch-theme.py section 1.7 on every build.
reward:
  enable: true
  title: 您的支持是我持续更新的最大动力
  wechat: /medias/reward/weixin.jpg
  alipay: /medias/reward/zhifubao.jpg

# Disable Tencent Captcha (not used)
tcaptcha:
  enable: false

# Disable click love effect
clicklove:
  enable: false
